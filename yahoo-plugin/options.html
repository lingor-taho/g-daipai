<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Yahoo 账号绑定</title>
<style>body{font:16px system-ui;max-width:680px;margin:40px auto;padding:20px}label{display:block;margin:18px 0}input{display:block;width:100%;box-sizing:border-box;padding:10px;margin-top:8px}button{padding:10px 20px}p{line-height:1.7}#status{white-space:pre-wrap}</style>
<h1>当前 Chrome profile 的 Yahoo 账号</h1><p>在后台「账号管理 → Yahoo 执行账号」复制账号 ID 和绑定码。请确认本 profile 的 Yahoo / Gmail 与后台该账号一致。修改绑定前先关闭正在执行的页面，保存后重新加载扩展。</p>
<form id="binding"><label>账号 ID<input id="account" type="number" min="1" required></label><label>插件绑定码<input id="token" type="password" autocomplete="off" required></label><button>保存绑定</button></form><p id="status"></p><script src="options.js"></script></html>
